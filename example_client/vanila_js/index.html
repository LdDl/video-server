<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <title>MSE workaround vanilla</title>
 </head>
 <body>
  <h2>Live Stream (MSE/WebSocket)</h2>
  <div class="mse-video">
    <video id="livestream" class="mse-video-size" autoplay controls muted/>
  </div>

  <hr>

  <h2>Archive Playback (MSE/WebSocket)</h2>
  <div class="archive-controls">
    <label>Stream ID: <input type="text" id="archiveStreamId" value="13bf3e5c-d537-4f10-98e8-9d0afca8b070" size="40"></label>
    <br><br>
    <label>Start from: <input type="datetime-local" id="archiveStartTime" value="2025-12-20T20:30:53"></label>
    <br><br>
    <button onclick="playArchive()">Play</button>
    <button onclick="stopArchive()">Stop</button>
  </div>
  <div id="archiveStatus" class="archive-status"></div>
  <div class="archive-video">
    <video id="archivePlayer" class="mse-video-size" autoplay controls muted></video>
  </div>

  <script>
    // Archive playback functions
    const API_HOST = 'localhost';
    const API_PORT = '8091';
    const WS_PORT = '8090';

    let archiveWs = null;
    let archiveMs = null;
    let archiveSourceBuffer = null;
    let archiveQueue = [];
    let archiveInitReceived = false;
    let serverPaused = false;  // True when server is waiting for "more"
    let archiveEnded = false;  // True when end-of-stream received and processed

    // Flow control: request more data when buffer ahead is less than this
    const BUFFER_LOW_THRESHOLD = 30; // seconds

    function playArchive() {
      const streamId = document.getElementById('archiveStreamId').value;
      const startTimeInput = document.getElementById('archiveStartTime').value;
      const statusDiv = document.getElementById('archiveStatus');
      const player = document.getElementById('archivePlayer');

      if (!startTimeInput) {
        statusDiv.innerHTML = '<p style="color:red">Please select a start time</p>';
        return;
      }

      // Convert datetime-local to Unix timestamp
      const startDate = new Date(startTimeInput);
      const startUnix = Math.floor(startDate.getTime() / 1000);

      stopArchive();
      statusDiv.innerHTML = `<p>Connecting... Starting from ${startDate.toLocaleString()}</p>`;

      if (!('MediaSource' in window)) {
        statusDiv.innerHTML = '<p style="color:red">MediaSource API not supported</p>';
        return;
      }

      archiveMs = new MediaSource();
      player.src = URL.createObjectURL(archiveMs);

      archiveMs.addEventListener('sourceopen', function() {
        startArchiveWS(streamId, startUnix, statusDiv, player);
      });

      archiveMs.addEventListener('sourceended', function() {
        statusDiv.innerHTML = '<p>Playback complete</p>';
      });
    }

    function stopArchive() {
      if (archiveWs) {
        archiveWs.close();
        archiveWs = null;
      }
      archiveInitReceived = false;
      archiveQueue = [];
      archiveSourceBuffer = null;
      serverPaused = false;
      archiveEnded = false;
      document.getElementById('archiveStatus').innerHTML = '<p>Stopped</p>';
    }

    function startArchiveWS(streamId, startUnix, statusDiv, player) {
      // No duration - server streams until archive ends with chunked flow control
      const wsUrl = `ws://${API_HOST}:${WS_PORT}/ws/archive?stream_id=${streamId}&start=${startUnix}`;

      archiveWs = new WebSocket(wsUrl);
      archiveWs.binaryType = 'arraybuffer';

      archiveWs.onopen = function() {
        statusDiv.innerHTML = '<p>Connected, waiting for data...</p>';
      };

      archiveWs.onclose = function(event) {
        // Mark as ended and wait for any pending SourceBuffer operations before ending stream
        archiveEnded = true;
        finishArchiveStream();
      };

      archiveWs.onerror = function(error) {
        console.error('[ARCHIVE] WebSocket error:', error);
        statusDiv.innerHTML = '<p style="color:red">Connection error</p>';
      };

      archiveWs.onmessage = function(event) {
        if (typeof event.data === 'string') {
          if (event.data === 'eos') {
            statusDiv.innerHTML = '<p>Playback complete</p>';
            serverPaused = false;
            archiveEnded = true;
            finishArchiveStream();
          } else if (event.data === 'pause') {
            serverPaused = true;
            // Check immediately if we need more data
            checkBufferAndRequestMore(player);
          }
          return;
        }

        const data = new Uint8Array(event.data);

        if (data[0] === 9) {
          // Codec info (init packet)
          archiveInitReceived = true;
          const mimeBytes = data.slice(1);
          let mimeCodec;
          if (window.TextDecoder) {
            mimeCodec = new TextDecoder('utf-8').decode(mimeBytes);
          } else {
            mimeCodec = String.fromCharCode.apply(null, mimeBytes);
          }
          const fullMime = 'video/mp4; codecs="' + mimeCodec + '"';

          if (!archiveSourceBuffer && archiveMs.readyState === 'open') {
            try {
              archiveSourceBuffer = archiveMs.addSourceBuffer(fullMime);
              archiveSourceBuffer.mode = 'segments';
              archiveSourceBuffer.addEventListener('updateend', loadArchivePacket);
              archiveSourceBuffer.addEventListener('error', function(e) {
                console.error('[ARCHIVE] SourceBuffer error:', e);
              });
              statusDiv.innerHTML = '<p>Receiving video data...</p>';
              // Process any data that arrived before SourceBuffer was ready
              if (archiveQueue.length > 0 && !archiveSourceBuffer.updating) {
                loadArchivePacket();
              }
            } catch (e) {
              console.error('[ARCHIVE] Failed to create SourceBuffer:', e);
              statusDiv.innerHTML = `<p style="color:red">Failed: ${e.message}</p>`;
            }
          }
        } else {
          // Video data
          if (!archiveInitReceived) {
            return;
          }
          pushArchivePacket(event.data, player);
        }
      };
    }

    function pushArchivePacket(data, player) {
      // Always queue data, even if SourceBuffer isn't ready yet
      archiveQueue.push(data);

      if (!archiveSourceBuffer) {
        // SourceBuffer not ready yet, data will be processed when it's created
        return;
      }

      if (!archiveSourceBuffer.updating) {
        loadArchivePacket();
      }

      // Auto-play when we have some data (but not if archive has ended)
      if (!archiveEnded && archiveSourceBuffer.buffered.length > 0) {
        const bufferStart = archiveSourceBuffer.buffered.start(0);
        const bufferEnd = archiveSourceBuffer.buffered.end(0);

        // Seek to buffer start if currentTime is before it
        if (player.currentTime < bufferStart) {
          player.currentTime = bufferStart + 0.1;
        }

        if (player.paused && bufferEnd - bufferStart > 0.5) {
          player.play().catch(e => {});
        }
      }
    }

    function loadArchivePacket() {
      if (!archiveSourceBuffer || archiveSourceBuffer.updating) return;

      if (archiveQueue.length > 0) {
        const data = archiveQueue.shift();
        try {
          archiveSourceBuffer.appendBuffer(data);
        } catch (e) {
          console.error('[ARCHIVE] appendBuffer error:', e);
        }
      }
    }

    // Check if buffer is low and request more data from server
    function checkBufferAndRequestMore(player) {
      if (!serverPaused || !archiveWs || archiveWs.readyState !== WebSocket.OPEN) {
        return;
      }

      if (!archiveSourceBuffer || !archiveSourceBuffer.buffered || archiveSourceBuffer.buffered.length === 0) {
        // No buffer yet, request more immediately
        archiveWs.send('more');
        serverPaused = false;
        return;
      }

      const bufferEnd = archiveSourceBuffer.buffered.end(0);
      const bufferAhead = bufferEnd - player.currentTime;

      if (bufferAhead < BUFFER_LOW_THRESHOLD) {
        archiveWs.send('more');
        serverPaused = false;
      }
    }

    // Periodic flow control for archive player
    setInterval(function() {
      const player = document.getElementById('archivePlayer');
      if (player && archiveSourceBuffer && archiveSourceBuffer.buffered && archiveSourceBuffer.buffered.length > 0) {
        const bufStart = archiveSourceBuffer.buffered.start(0);
        const bufEnd = archiveSourceBuffer.buffered.end(0);

        // Auto-seek to buffer start if needed, but NOT if archive has ended
        // (to prevent looping back to start after playback completes)
        if (!archiveEnded && player.currentTime < bufStart) {
          player.currentTime = bufStart + 0.1;
        }
        // Auto-play only if archive hasn't ended
        if (!archiveEnded && player.paused && bufEnd - bufStart > 0.5) {
          player.play().catch(e => {});
        }

        // Check if we need more data from server
        checkBufferAndRequestMore(player);
      }
    }, 1000);

    function finishArchiveStream() {
      // If no source buffer or MediaSource not open, nothing to do
      if (!archiveMs || archiveMs.readyState !== 'open') {
        return;
      }

      // If SourceBuffer is still updating, wait for it to finish
      if (archiveSourceBuffer && archiveSourceBuffer.updating) {
        archiveSourceBuffer.addEventListener('updateend', function onUpdateEnd() {
          archiveSourceBuffer.removeEventListener('updateend', onUpdateEnd);
          finishArchiveStream();
        });
        return;
      }

      // Process any remaining queue items
      if (archiveQueue.length > 0 && archiveSourceBuffer && !archiveSourceBuffer.updating) {
        const data = archiveQueue.shift();
        try {
          archiveSourceBuffer.appendBuffer(data);
          // Will call finishArchiveStream again via updateend handler
          archiveSourceBuffer.addEventListener('updateend', function onUpdateEnd() {
            archiveSourceBuffer.removeEventListener('updateend', onUpdateEnd);
            finishArchiveStream();
          });
          return;
        } catch (e) {
          console.error('[ARCHIVE] appendBuffer error in finish:', e);
        }
      }

      // All done, safely end the stream
      try {
        archiveMs.endOfStream();
      } catch (e) {
        // Ignore - stream may already be ended
      }
    }
  </script>

  <script>
    let initReceived = false;

    function initialize () {
      let load = document.getElementById('livestream');

      if ('MediaSource' in window) {
          let ms = new MediaSource();

          ms.addEventListener('sourceopen', function() {
            start(ms);
          }, false);

          load.src = window.URL.createObjectURL(ms);

          load.onerror = (e) => {
            console.error("[LIVE] Video error:", load.error);
          };
      } else {
          console.error('Unsupported: MSE')
      }
    }

    // Start job with WebSocket
    function start (ms) {
      let load = document.getElementById('livestream')
      const schema = 'ws'
      const server = 'localhost'
      const port = '8090'
      const streamID = '13bf3e5c-d537-4f10-98e8-9d0afca8b070'

      let ws = new WebSocket(schema + '://' + server + ':' + port + '/ws/live?stream_id=' + streamID)
      ws.binaryType = 'arraybuffer'

      ws.onmessage = function(event) {
        const data = new Uint8Array(event.data)

        if (data[0] === 9) {
          // Decode initialization
          initReceived = true;
          const decodedArr = data.slice(1)
          let mimeCodec
          if (window.TextDecoder) {
              mimeCodec = new TextDecoder('utf-8').decode(decodedArr)
          } else {
              mimeCodec = String.fromCharCode(decodedArr)
          }

          const fullMime = 'video/mp4; codecs="' + mimeCodec + '"';

          if (!sourceBuffer && load) {
              try {
                  sourceBuffer = ms.addSourceBuffer(fullMime);
                  sourceBuffer.mode = 'segments';

                  sourceBuffer.addEventListener('updateend', function() {
                    loadPacket();
                  });

                  sourceBuffer.addEventListener('error', function(e) {
                    console.error("[LIVE] SourceBuffer error:", e);
                  });
              } catch (e) {
                  console.error("[LIVE] Failed to create SourceBuffer:", e);
              }
          }
        } else {
          // Video/audio data packet
          if (!initReceived) {
            return;
          }
          pushPacket(event.data)
        }
      };
      ws.onerror = function(error) {
        console.error("[LIVE] WebSocket error:", error);
      };
    }

    function pushPacket (data) {
      let load = document.getElementById('livestream');

      if (!sourceBuffer) {
        return;
      }

      if (!streamStarted && load) {
          try {
            sourceBuffer.appendBuffer(data);
            streamStarted = true;
          } catch (e) {
            console.error("[LIVE] Error appending buffer:", e);
          }
          return;
      }

      streamQueue.push(data);

      if (!sourceBuffer.updating) {
          loadPacket();
      }
    }

    function loadPacket () {
      let load = document.getElementById('livestream')
      if (!sourceBuffer) return;

      if (!sourceBuffer.updating && load) {
          if (streamQueue.length > 0) {
              const inp = streamQueue.shift()
              try {
                sourceBuffer.appendBuffer(inp)
              } catch (e) {
                console.error("[LIVE] Error in loadPacket:", e);
              }
          } else {
              streamStarted = false
          }
      }
    }

    // Periodic auto-seek for live stream
    setInterval(function() {
      let load = document.getElementById('livestream');
      if (load && sourceBuffer && sourceBuffer.buffered && sourceBuffer.buffered.length > 0) {
        const bufferStart = sourceBuffer.buffered.start(0);
        const bufferEnd = sourceBuffer.buffered.end(0);

        // If currentTime is before buffer start, seek to buffer start
        if (load.currentTime < bufferStart) {
          load.currentTime = bufferStart + 0.1;
        }

        // Auto-play if paused and we have data
        if (load.paused && bufferEnd - bufferStart > 0.5) {
          load.play().catch(e => {});
        }
      }
    }, 1000);

    let sourceBuffer, streamQueue = [];
    let streamStarted = false;
    initialize();
    
  </script>
  <style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    h2 {
        color: #333;
    }
    .mse-video-size {
        width: 720px;
        height: 400px;
        object-fit: cover;
        background: #000;
    }
    .archive-controls {
        margin: 15px 0;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 5px;
    }
    .archive-controls label {
        margin-right: 15px;
    }
    .archive-controls button {
        padding: 8px 16px;
        margin-right: 10px;
        cursor: pointer;
    }
    .archive-status {
        margin: 10px 0;
        padding: 10px;
        background: #e8f4e8;
        border-radius: 5px;
    }
    .archive-status p {
        margin: 0;
    }
    hr {
        margin: 30px 0;
        border: none;
        border-top: 1px solid #ddd;
    }
  </style>
 </body>
</html>
